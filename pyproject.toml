[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "independent-agent"
version = "0.1.0"
description = "Independent AI agent client for the Agent Authorization Gateway — built from the v0.3 protocol spec, zero shared code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "cryptography>=44.0.0",
    "PyJWT>=2.9.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.3.0", "langchain-openai>=0.3.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
